<section class="section">
  <p class="section-label">Formation</p>
  <div class="timeline">
    @for (edu of educations; track edu.degree) {
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <p class="timeline-date">{{ edu.period }}</p>
        <p class="timeline-title">{{ edu.degree }}</p>
        <a class="timeline-school" [href]="edu.link" target="_blank">
          <img [src]="edu.schoolLogo" class="timeline-img">
          {{ edu.school }}
        </a>
        <p class="timeline-desc">{{ edu.description }}</p>
        <div class="timeline-tags">
          @for (tag of edu.tags; track tag) {
            <span class="timeline-tag">{{ tag }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>

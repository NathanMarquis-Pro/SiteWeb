<section id="contact" class="section">
    <div class="contact-row">
      <p class="contact-big serif">{{ profile.contactTitle }}</p>
      <div class="contact-links">
        @for (contact of profile.contacts; track contact.label) {
          <a [href]="contact.url" class="contact-link" [attr.target]="contact.external ? '_blank' : null"><i [class]="contact.icon" aria-hidden="true"></i> {{ contact.label }}</a>
        }
      </div>
    </div>
    <em>{{ profile.copyright }}</em>
</section>

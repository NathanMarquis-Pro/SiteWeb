<section id="haut" class="hero scroll-mt-20">
  <div class="hero-content conteneur flex-col-reverse justify-between gap-12 pt-18 pb-20 lg:flex-row">
    <div>
      <span class="badge badge-outline badge-lg mb-7 h-auto gap-2 py-1.5 font-normal">
        <span class="status status-success" aria-hidden="true"></span>{{ t().hero.dispo }}
      </span>
      <p class="text-lg text-base-content/80">{{ t().hero.identite }}</p>
      <h1 class="mt-3.5 font-serif text-[clamp(44px,6vw,72px)] leading-[1.04] font-normal text-primary">
        {{ t().hero.titre1 }}<br><em class="text-secondary">{{ t().hero.titre2 }}</em>
      </h1>
      <p class="mt-7 max-w-[580px] text-lg text-base-content/80">{{ t().hero.paragraphe1 }}</p>
      <p class="mt-3.5 max-w-[580px] text-lg text-base-content/80">{{ t().hero.paragraphe2 }}</p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a href="#nutriscope" class="btn btn-primary">{{ t().hero.bouton1 }}</a>
        <a [href]="liens.cv" [attr.download]="liens.cvNomTelechargement" class="btn btn-ghost">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
          {{ t().hero.bouton2 }}
        </a>
      </div>
    </div>
    <div class="avatar">
      <div class="w-72 rounded-box">
        <img [src]="liens.photo" alt="Nathan Marquis">
      </div>
    </div>
  </div>
</section>

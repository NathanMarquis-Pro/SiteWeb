<section id="imsa" class="conteneur scroll-mt-20 py-20">
  <p class="text-base-content/60">{{ t().imsa.surtitre }}</p>
  <h2 class="mt-2 max-w-[760px] font-serif text-[clamp(32px,4vw,46px)] leading-[1.12] font-normal text-primary">{{ t().imsa.titre }}</h2>

  <div class="mt-8 grid gap-10 lg:grid-cols-2">
    <div class="text-[17px] text-base-content/80">
      <p>{{ t().imsa.p1 }}</p>
      <p class="mt-4">{{ t().imsa.p2 }}</p>
      <p class="mt-4">{{ t().imsa.p3 }}</p>
    </div>

    <div class="grid min-w-0 gap-4 sm:grid-cols-2">
      <div role="group" [attr.aria-label]="t().imsa.ariaAvant" class="min-w-0 overflow-x-auto rounded-box bg-neutral p-4 font-mono text-[11.5px] leading-relaxed text-neutral-content">
        <span class="badge badge-sm mb-3">{{ t().imsa.badgeAvant }}</span>
        <pre>{{ codeAvant }}</pre>
      </div>
      <div role="group" [attr.aria-label]="t().imsa.ariaApres" class="min-w-0 overflow-x-auto rounded-box border border-base-300 bg-base-100 p-4 font-mono text-[11.5px] leading-relaxed">
        <span class="badge badge-soft badge-success badge-sm mb-3">{{ t().imsa.badgeApres }}</span>
        <pre>{{ codeApres }}</pre>
      </div>
    </div>
  </div>

  <div class="mt-10 flex flex-wrap items-baseline gap-x-10 gap-y-3 border-t border-base-300 pt-6">
    @for (r of t().imsa.resultats; track $index) {
      <p>{{ r.avant }}<strong class="text-primary" [class.text-2xl]="$index < 2">{{ r.fort }}</strong>{{ r.apres }}</p>
    }
  </div>
</section>

<header class="sticky top-0 z-50 border-b border-base-300 bg-base-100">
  <nav class="navbar conteneur">
    <div class="navbar-start">
      <a href="#haut" class="text-lg font-medium">Nathan Marquis</a>
    </div>
    <div class="navbar-end items-center gap-2">
      <ul class="menu menu-horizontal hidden flex-nowrap items-center whitespace-nowrap lg:flex">
        <li><a href="#nutriscope">{{ t().nav.nutriscope }}</a></li>
        <li><a href="#imsa">{{ t().nav.imsa }}</a></li>
        <li><a href="#projets">{{ t().nav.projets }}</a></li>
        <li><a href="#parcours">{{ t().nav.parcours }}</a></li>
      </ul>
      <div class="join" role="group" [attr.aria-label]="t().nav.langue">
        <button type="button" class="btn btn-xs join-item" [class.btn-primary]="langue.lang() === 'fr'" [attr.aria-pressed]="langue.lang() === 'fr'" (click)="langue.setLang('fr')">FR</button>
        <button type="button" class="btn btn-xs join-item" [class.btn-primary]="langue.lang() === 'en'" [attr.aria-pressed]="langue.lang() === 'en'" (click)="langue.setLang('en')">EN</button>
      </div>
      <a href="#contact" class="btn btn-primary btn-sm hidden sm:inline-flex">{{ t().nav.contact }}</a>
      <div class="dropdown dropdown-end lg:hidden">
        <button type="button" class="btn btn-ghost btn-square" [attr.aria-label]="t().nav.ouvrirMenu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
        </button>
        <ul class="menu dropdown-content bg-base-100 rounded-box border border-base-300 w-56 p-2">
          <li><a href="#nutriscope">{{ t().nav.nutriscope }}</a></li>
          <li><a href="#imsa">{{ t().nav.imsa }}</a></li>
          <li><a href="#projets">{{ t().nav.projets }}</a></li>
          <li><a href="#parcours">{{ t().nav.parcours }}</a></li>
          <li><a href="#contact">{{ t().nav.contact }}</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

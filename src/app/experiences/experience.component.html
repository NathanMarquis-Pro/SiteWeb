<section id="experiences" class="section">
  <p class="section-label">Expériences</p>
  <div class="timeline">
    @for (exp of experiences; track exp.role) {
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <p class="timeline-date">{{ exp.period }}</p>
        <p class="timeline-title">{{ exp.role }}</p>
        <p class="timeline-company">
          <img [src]="exp.companyLogo" class="timeline-img">
          {{ exp.company }}
        </p>
        <p class="timeline-desc">{{ exp.description }}</p>
        <div class="timeline-tags">
          @for (tag of exp.tags; track tag) {
            <span class="timeline-tag">{{ tag }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>

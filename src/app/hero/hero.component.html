<section id="hero">
    <span class="hero-tag">{{ profile.title }}</span>
    <h1 class="hero-title serif">{{ profile.heroTitle.main }} <br><em> {{ profile.heroTitle.emphasis }}</em></h1>
    <p class="hero-sub">{{ profile.tagline }}</p>
    <div class="hero-ctas">
        <button class="btn-primary"><a href="#projects">Voir mes projets</a></button>
        <a [href]="profile.cvPath" class="btn-ghost" [attr.download]="profile.cvDownloadName">Télécharger le CV →</a>
    </div>

    <div class="stack-badges">
        @for (badge of profile.stackBadges; track badge) {
            <span class="badge">{{ badge }}</span>
        }
    </div>
</section>

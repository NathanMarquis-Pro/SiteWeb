<section id="about" class="section">
    <p class="section-label">À propos</p>
    <div class="about-grid">
        <p class="about-text">{{ profile.about.paragraphs.join(' ') }}</p>
        <div class="stat-row">
            @for (stat of profile.about.stats; track stat.value) {
                <div class="stat">
                    <div><div class="stat-num">{{ stat.value }}</div><div class="stat-label">{{ stat.label }}</div></div>
                </div>
            }
        </div>
    </div>
</section>
